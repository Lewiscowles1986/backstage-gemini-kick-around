services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: backstage
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  kroki:
    image: yuzutech/kroki
    environment:
      - KROKI_MERMAID_HOST=mermaid
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      - mermaid

  mermaid:
    image: yuzutech/kroki-mermaid
    expose:
      - "8002"

  # Helper to create the bucket since MinIO doesn't create it automatically
  create-bucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb local/backstage-techdocs;
      exit 0;
      "

  backstage:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: backstage
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      BACKEND_SECRET: "placeholder-secret-for-dev"
      GITHUB_TOKEN: "placeholder-token-for-dev"
    ports:
      - "7007:7007"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7007/.backstage/health/v1/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
      kroki:
        condition: service_healthy
      minio:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    volumes:
      - ./sample-repos:/app/sample-repos
      - ./app-config.yaml:/app/app-config.yaml
      - ./app-config.production.yaml:/app/app-config.production.yaml

  # Docs Builder for Repo A
  docs-build-repo-a:
    build:
      context: .
      dockerfile: Dockerfile.techdocs
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_S3_FORCE_PATH_STYLE: "true"
    volumes:
      - ./sample-repos/repo-a:/src
      - ./techdocs-defaults.yml:/techdocs-defaults.yml
    # Generate and then Publish to S3
    command: >
      sh -c "techdocs-cli generate --verbose --no-docker --source-dir /src --output-dir /tmp/repo-a --config /techdocs-defaults.yml &&
      techdocs-cli publish --publisher-type awsS3 --storage-name backstage-techdocs --awsS3ForcePathStyle --entity default/Component/repo-a --directory /tmp/repo-a"
    depends_on:
      backstage:
        condition: service_healthy

  # Docs Builder for Repo B
  docs-build-repo-b:
    build:
      context: .
      dockerfile: Dockerfile.techdocs
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_S3_FORCE_PATH_STYLE: "true"
    volumes:
      - ./sample-repos/repo-b:/src
      - ./techdocs-defaults.yml:/techdocs-defaults.yml
    command: >
      sh -c "techdocs-cli generate --verbose --no-docker --source-dir /src --output-dir /tmp/repo-b --config /techdocs-defaults.yml &&
      techdocs-cli publish --publisher-type awsS3 --storage-name backstage-techdocs --awsS3ForcePathStyle --entity default/Component/repo-b --directory /tmp/repo-b"
    depends_on:
      backstage:
        condition: service_healthy
